name: Deploy Touristt site

# Rebuilds touristt/site from data.mjs and publishes it to the gh-pages
# branch, which GitHub Pages serves.
on:
  push:
    branches: [main, claude/confident-ptolemy-z5vst7]
    paths: ["touristt/**", ".github/workflows/deploy-touristt.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-touristt
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site
        run: node touristt/build.mjs
      - name: Publish to gh-pages
        run: |
          cd touristt/site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy Touristt site from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
